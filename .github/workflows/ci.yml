# The checks in CONTRIBUTING.md, the minimum Rust versions the README
# states, a spell check, and the mutation runner's memory cap, on every push
# to main and every pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain rust-toolchain.toml names, which cargo then uses
      - run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The version that formatted the Markdown, so that both agree
      - run: npx --yes prettier@3.9.10 --check README.md CONTRIBUTING.md 'docs/**/*.md' 'tools/**/*.md'

  # arrow-rs's properties need Rust 1.88, and the DataFusion adapter 1.95.
  # `+` overrides rust-toolchain.toml
  msrv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rust: "1.88"
            packages: -p arrow-pbt
          - rust: "1.95"
            packages: --workspace
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - run: cargo +${{ matrix.rust }} check ${{ matrix.packages }} --all-targets

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version arrow-rs pins. A newer one can flag new words
      - uses: taiki-e/install-action@v2
        with:
          tool: typos@1.37.0
      - run: typos
      # tools/mutation/run.py caps each worker by the resident memory of its
      # process group, which it reads from `ps`. Check that it reads all of a
      # group on Linux
      - name: The mutation runner reads a process group's memory
        run: |
          python3 -B - <<'EOF'
          import importlib.util, subprocess, sys, time
          spec = importlib.util.spec_from_file_location("run", "tools/mutation/run.py")
          run = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(run)
          # Two processes in one new process group, each writing every byte it holds
          hold = 'import time; x = b"x" * ({} * 1024 * 1024); time.sleep(5)'
          p = subprocess.Popen(f"python3 -c '{hold.format(300)}' & python3 -c '{hold.format(200)}' & wait", shell=True, start_new_session=True)
          time.sleep(3)
          mb = run.group_rss_kb(p.pid) // 1024
          p.wait()
          print(f"process group of 300 MB and 200 MB: {mb} MB")
          sys.exit(0 if mb >= 500 else 1)
          EOF
